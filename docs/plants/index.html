<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プルフカ植物図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F8F4;--ink:#665550;--head:#806060;--line:#E5DED5;--card:#FFFFFF;--accent:#806060;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
header{max-width:1080px;margin:0 auto;padding:28px 20px 8px}
h1{color:var(--head);font-size:28px;margin:0 0 4px}
.sub{margin:0 0 12px;font-size:14px}
nav{font-size:14px;margin-bottom:8px}
nav a{color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:0 20px 48px}
.controls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0 8px}
.controls input[type=search]{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.filters label{font-size:13px;display:flex;flex-direction:column;gap:2px}
.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff;font-size:14px}
button.reset{padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px;align-self:flex-end}
#count{font-size:14px;margin:10px 2px}
#source{font-size:12px;color:#9a8a80;margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.card:hover{box-shadow:0 4px 16px rgba(102,85,80,.15)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eee}
.img-ph{width:100%;aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#EFEAE3;color:#9a8a80;font-size:14px}
.card-body{padding:12px 14px 14px}
.card-body h2{font-size:18px;color:var(--head);margin:0 0 2px}
.chelsno{font-style:italic;font-size:13px;margin:0 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--bg)}
.habitat{font-size:13px;margin:0}
.empty{padding:32px;text-align:center;color:#9a8a80}
.modal{position:fixed;inset:0;background:rgba(60,45,40,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:14px;max-width:680px;width:100%;overflow:hidden}
.modal-card img{width:100%;max-height:420px;object-fit:cover;display:block}
.modal-body{padding:20px 24px 28px}
.modal-body h2{color:var(--head);margin:0}
.modal-body table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
.modal-body th,.modal-body td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.modal-body th{width:110px;color:var(--head);font-weight:700}
.close{float:right;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:14px;color:var(--ink)}
footer{max-width:1080px;margin:0 auto;padding:0 20px 32px;font-size:12px;color:#9a8a80}

.gallery .modal-caption{font-size:13px;color:#9a8a80;margin:6px 0 0}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumb{border:2px solid var(--line);border-radius:8px;padding:0;background:#fff;cursor:pointer;width:96px;text-align:left;font:inherit;color:inherit;overflow:hidden}
.thumb.active{border-color:var(--accent)}
.thumb img{width:100%;height:72px;object-fit:cover;display:block}
.thumb span{display:block;font-size:11px;padding:4px 6px;line-height:1.4}
</style>
</head>
<body>
<header>
  <h1>プルフカ植物図鑑</h1>
  <p class="sub">架空の星プルフカの植物たち。Wikipedia風の図鑑。チェルスノー語名はすべて仮名です。</p>
  <nav><a href="../animals/">動物図鑑へ →</a> ｜ <a href="../">プルフカ図鑑トップへ</a></nav>
</header>
<main>
  <div class="controls">
    <input type="search" id="q" placeholder="検索：名前・チェルスノー語名・説明・生息地・特徴など（部分一致）" aria-label="検索">
    <div class="filters">
      <label>分類
        <select id="f-category"><option value="">すべて</option><option>草</option><option>花</option><option>樹木</option><option>果物</option><option>野菜</option></select>
      </label>
      <label>可食
        <select id="f-edible"><option value="">すべて</option><option>可食</option><option>不可食</option></select>
      </label>
      <label>毒性
        <select id="f-toxicity"><option value="">すべて</option><option>無毒</option><option>有毒</option></select>
      </label>
      <label>由来
        <select id="f-origin"><option value="">すべて</option><option>在来種</option><option>外来種</option><option>外国種</option></select>
      </label>
      <button class="reset" id="reset" type="button">リセット</button>
    </div>
  </div>
  <p id="count"></p>
  <p id="source"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>条件に合う種がありません。検索や絞り込みを変えてみてください。</p>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<footer>プルフカ植物図鑑（プロトタイプ）。在来種＝チェルスノー国内にいるもの、外来種＝チェルスノー国外から国内に入ってきたもの、外国種＝チェルスノー国外にいるもの。</footer>
<script type="application/json" id="embedded-data">{
 "entries": [
  {
   "category": "草",
   "continent": "A大陸",
   "description": "雪解け直後に芽吹く多年草。葉は細長く、表面に白い産毛が生えており、霜から芽を守る。茎は地表を這い、節から根を出して広がる。花は小さく白い星形で、雪解けから約2週間で咲く。根は地中深くまで伸び、冬のあいだは栄養をためる。",
   "edible": "可食",
   "habitat": "A大陸・チェルスノー首都圏北部の雪原の縁と川沿いの湿地。雪解け水のたまる場所に群生する。",
   "id": "P001",
   "image": "images/P001.jpg",

   "images": [
    {
     "caption": "群生（雪解け期）",

   ],
   "name_chelsno": "shíkrũ",
   "name_ja": "ユキシダ",
   "origin": "在来種",
   "season": "春〜夏（雪解け期）。若芽は雪解け直後の2〜3週間が食べごろ。",
   "size": "高さ20〜40cm。群生すると一面を覆う。",
   "taste": "若芽はシャキシャキとした歯ごたえで、ほのかな甘みがある。苦みは少なく、生でも食べられる。茹でるとぬめりが出る。",
   "toxicity": "無毒",
   "use": "若芽は食用。葉は乾燥させて保存食にする。根は粉にして焼き菓子の材料にされる。"
  },
  {
   "category": "樹木",
   "continent": "C大陸",
   "description": "常緑の針葉樹。幹は灰白色で、樹皮は薄く剥がれやすい。葉は青緑色の針状で、表面に蝋の層があり、寒さと乾燥から身を守る。枝から出る樹液は乳白色で、皮膚に触れるとかぶれる。樹高は寒冷乾燥地の樹木としては高く、遠くからでも目立つ。",
   "edible": "不可食",
   "habitat": "C大陸内陸の寒冷乾燥地。川沿いの緑地帯に点在する。チェルスノー国外にのみ自生する。",
   "id": "P002",
   "image": "images/P002.jpg",
   "image_status": "generated",
   "images": [
    {
     "caption": "全体",

    },
    {

   "habitat": "A大陸南部の丘陵地で栽培される。もとはB大陸（太縫国）の山地に自生し、交易で種が持ち込まれた。",
   "id": "P003",

   "images": [
    {

    {

     "src": "images/P003-fruit.jpg",

   "name_chelsno": "áomílũ",

   "size": "低木で高さ1〜2m。果実は直径3〜4cm。",
   "taste": "甘酸っぱく、皮は薄くてそのまま食べられる。果汁が多く、口に入れるとさわやかな酸味が広がる。完熟すると甘みが強くなる。",
   "toxicity": "無毒",
   "use": "生食のほか、果実酒やジャムにされる。乾燥させると甘みが凝縮し、保存食になる。"
  }
 ],
 "note": "チェルスノー語名はすべて仮名。既存辞書（Cdic.json 1,582語）と照合し、2026-11-28時点で衝突がないことを確認済み。ただしスプレッドシート側の最新辞書との再照合はまだなので、みゅらが正式名を決めたら書き換えること。",
 "title": "プルフカ植物図鑑",
 "updated": "2026-11-28"
}</script>
<script>
const JSON_FILE = "plants.json";
let DATA = null, DATA_SOURCE = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getImages(e){
  if(Array.isArray(e.images) && e.images.length) return e.images.map(im=>({src:im.src,caption:im.caption||"",status:im.status||"placeholder"}));
  if(e.image) return [{src:e.image,caption:"",status:e.image_status||"placeholder"}];
  return [];
}
function imgHtml(src, alt){
  return '<img src="'+esc(src)+'" alt="'+esc(alt)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;img-ph&quot;>画像準備中<br><small>placeholder</small></div>\'">';
}
function imgTag(e, cls){
  const imgs = getImages(e);
  if(!imgs.length) return '<div class="img-ph">画像準備中<br><small>placeholder</small></div>';
  return imgHtml(imgs[0].src, e.name_ja);
}
function searchText(e){
  return [e.name_ja,e.name_chelsno,e.category,e.description,e.use,e.habitat,e.continent,e.size,e.season,e.taste,e.edible,e.toxicity,e.origin].concat(getImages(e).map(im=>im.caption)).filter(Boolean).join(" ").toLowerCase();
}
function applyFilters(){
  const q = $("q").value.trim().toLowerCase();
  const f = {
    category:$("f-category").value, edible:$("f-edible").value, toxicity:$("f-toxicity").value,
    origin:$("f-origin").value
  };
  const shown = DATA.entries.filter(e => {
    if(q && !searchText(e).includes(q)) return false;
    if(f.category && e.category!==f.category) return false;
    if(f.edible && e.edible!==f.edible) return false;
    if(f.toxicity && e.toxicity!==f.toxicity) return false;
    if(f.origin && e.origin!==f.origin) return false;
    return true;
  });
  render(shown);
}
function render(list){
  const grid = $("grid");
  $("count").textContent = "全" + DATA.entries.length + "件中 " + list.length + "件を表示";
  $("empty").hidden = list.length>0;
  grid.innerHTML = list.map(e =>
    '<article class="card" data-id="'+esc(e.id)+'" tabindex="0">' + imgTag(e) +
    '<div class="card-body"><h2>'+esc(e.name_ja)+'</h2><p class="chelsno">'+esc(e.name_chelsno)+'（仮名）</p>' +
    '<div class="badges"><span class="badge">'+esc(e.category)+'</span><span class="badge">'+esc(e.edible)+'</span><span class="badge">'+esc(e.toxicity)+'</span><span class="badge">'+esc(e.origin)+'</span></div>' +
    '<p class="habitat">'+esc(e.habitat)+'</p></div></article>'
  ).join("");
  grid.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>openModal(card.dataset.id));
    card.addEventListener("keydown",ev=>{if(ev.key==="Enter") openModal(card.dataset.id);});
  });
}
function openModal(id){
  const e = DATA.entries.find(x=>x.id===id); if(!e) return;
  const rows = [
    ["分類",e.category],["チェルスノー語名",e.name_chelsno+"（仮名）"],["生息地",e.habitat],
    ["生息大陸",e.continent],["大きさ",e.size],["時期",e.season],["可食",e.edible],
    ["毒性",e.toxicity],["由来",e.origin]
  ];
  if(e.taste) rows.push(["味",e.taste]);
  if(e.use) rows.push(["用途",e.use]);
  $("modal-body").innerHTML =
    '<button class="close" id="close" type="button">閉じる ×</button>' + galleryHtml(e) +
    '<h2>'+esc(e.name_ja)+'</h2><p class="chelsno">'+esc(e.name_chelsno)+'（仮名）・ '+esc(e.id)+'</p>' +
    '<table>'+rows.map(r=>'<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join("")+'</table>' +
    '<p>'+esc(e.description)+'</p>';
  $("modal").classList.add("open");
  $("close").addEventListener("click",closeModal);
  wireThumbs(e);
}
function galleryHtml(e){
  const imgs = getImages(e);
  if(!imgs.length) return '<div class="img-ph">画像準備中<br><small>placeholder</small></div>';
  let html = '<div class="gallery"><div id="main-img-wrap">' + imgHtml(imgs[0].src, e.name_ja) + '</div>' +
    '<p class="modal-caption" id="main-caption">' + esc(imgs[0].caption) + '</p>';
  if(imgs.length > 1){
    html += '<div class="thumbs">' + imgs.map((im,i)=>
      '<button type="button" class="thumb' + (i===0?' active':'') + '" data-idx="'+i+'">' +
      '<img src="'+esc(im.src)+'" alt="'+esc(im.caption||e.name_ja)+'" loading="lazy" onerror="this.parentElement.style.display=\'none\'">' +
      (im.caption ? '<span>'+esc(im.caption)+'</span>' : '') + '</button>'
    ).join("") + '</div>';
  }
  return html + '</div>';
}
function wireThumbs(e){
  const imgs = getImages(e);
  document.querySelectorAll(".thumb").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const im = imgs[Number(btn.dataset.idx)]; if(!im) return;
      document.getElementById("main-img-wrap").innerHTML = imgHtml(im.src, e.name_ja);
      document.getElementById("main-caption").textContent = im.caption || "";
      document.querySelectorAll(".thumb").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
}
function closeModal(){ $("modal").classList.remove("open"); }
$("modal").addEventListener("click",ev=>{if(ev.target.id==="modal") closeModal();});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape") closeModal();});
["q","f-category","f-edible","f-toxicity","f-origin"].forEach(id=>{
  $(id).addEventListener("input",applyFilters);
  $(id).addEventListener("change",applyFilters);
});
$("reset").addEventListener("click",()=>{
  $("q").value="";
  ["f-category","f-edible","f-toxicity","f-origin"].forEach(id=>$(id).value="");
  applyFilters();
});
async function load(){
  try{
    const res = await fetch(JSON_FILE);
    if(!res.ok) throw new Error("HTTP "+res.status);
    DATA = await res.json(); DATA_SOURCE = JSON_FILE + " から読み込み";
  }catch(err){
    DATA = JSON.parse(document.getElementById("embedded-data").textContent);
    DATA_SOURCE = "内蔵データから表示（"+JSON_FILE+" の fetch に失敗したため）";
  }
  $("source").textContent = "データ: " + DATA_SOURCE + " ｜ 更新: " + (DATA.updated||"");
  applyFilters();
}
load();
</script>
</body>
</html>
