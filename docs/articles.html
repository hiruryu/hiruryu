<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>「竜の巣」 - Articles</title>
  <meta property="og:title" content="竜の巣 - 記事一覧">
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main-style.css">
</head>
<body>
  <div class="ground" style="min-height:97%;">
    <div style="min-height:95%;"></div>
    <div class="titlemain">📃 Articles</div>
    <nav class="menu">
      <a href="?set=articles" class="marker" style="font-size:16px;"><span>記事一覧</span></a>　
      <a href="?set=智語教科書" style="font-size:20px;"><span class="titleA">智語教科書</span></a>
    </nav>
    <br>
    <ul class="item-list" id="item-list">
      <li class="loading">読み込み中…</li>
    </ul>

    <script>
      async function loadList() {
  const ul = document.getElementById('item-list');
  const params = new URLSearchParams(location.search);
  const setName = params.get('set') || 'articles';

  // JSONファイルと記事の格納先
  const folderMap = {
    'articles': [
      { list: 'articles/list.json', base: 'articles/' },
      { list: 'articles/ctext/list.json', base: 'articles/ctext/' }
    ],
    '智語教科書': [
      { list: 'articles/ctext/list.json', base: 'articles/ctext/' }
    ]
  };

  const folders = folderMap[setName] || folderMap['articles'];

  let articles = [];

  // 各JSONから記事一覧を取得
  for (const folder of folders) {
    try {
      const res = await fetch(folder.list);

      if (!res.ok) {
        throw new Error(`${folder.list}: ${res.status}`);
      }

      const files = await res.json();

      for (const file of files) {
        const href = new URL(file, new URL(folder.base, location.href)).href;

        articles.push({ href });
      }

    } catch (err) {
      console.error(`一覧取得エラー: ${folder.list}`, err);
    }
  }

  if (articles.length === 0) {
    ul.innerHTML = `<li class="empty">${setName} が見つかりませんでした。</li>`;
    return;
  }

  // 各記事のタイトル・公開日時を取得
  articles = await Promise.all(articles.map(async article => {
    let title = decodeURIComponent(
      new URL(article.href).pathname.split('/').pop()
    ).replace(/\.html$/, '');

    let publishedTime = null;

    try {
      const res = await fetch(article.href);

      if (res.ok) {
        const text = await res.text();
        const doc = new DOMParser().parseFromString(text, 'text/html');

        const tTag = doc.querySelector('title');
        if (tTag && tTag.textContent.trim()) {
          title = tTag.textContent.trim();
        }

        const metaDate = doc.querySelector('meta[name="date"]');

        if (metaDate) {
          publishedTime = metaDate.getAttribute('content');
        }
      }
    } catch (err) {
      console.warn(`記事情報取得失敗: ${article.href}`, err);
    }

    return {
      ...article,
      title,
      publishedTime
    };
  }));

  // 公開日時で並び替え
  articles.sort((a, b) => {
    if (a.publishedTime && b.publishedTime) {
      const diff = new Date(a.publishedTime) - new Date(b.publishedTime);
      return setName === '智語教科書' ? diff : -diff;
    }

    if (a.publishedTime) return -1;
    if (b.publishedTime) return 1;

    return 0;
  });

  // 記事一覧を表示
  ul.innerHTML = '';

  articles.forEach(article => {
    const li = document.createElement('li');
    const a = document.createElement('a');

    a.href = article.href;
    a.style.fontSize = '20px';
    a.style.lineHeight = '2';
    a.textContent = article.title;

    li.appendChild(a);
    ul.appendChild(li);
  });
}

document.addEventListener('DOMContentLoaded', loadList);
    </script>
    <br>
    <a href="index.html" class="marker" style="font-size:20px;">メインページに戻る</a>
  </div>
  <br>
</body>
</html>
