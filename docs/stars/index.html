<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>プルフカ星系 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="scene-wrap" aria-label="プルフカ星系の3Dビュー"></div>
    <div id="labels"></div>

    <div id="topbar">
      <div class="seg" role="group" aria-label="ビューの切り替え">
        <button id="view-system" aria-pressed="true">惑星系 <small style="font-weight:400">AU</small></button>
        <button id="view-nearby" aria-pressed="false">近傍恒星 <small style="font-weight:400">ly</small></button>
        <button id="view-sky" aria-pressed="false">夜空 <small style="font-weight:400">プルフカ</small></button>
      </div>
      <div class="controls">
        <div class="ctl-group">
          <button class="ctl-btn" id="play-btn" aria-pressed="true">
            <svg id="play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="2" width="4" height="12" rx="1"/><rect x="9.5" y="2" width="4" height="12" rx="1"/></svg>
            <span id="play-label">一時停止</span>
          </button>
          <label class="speed">速度
            <input type="range" id="speed" min="1" max="60" step="1" value="12" aria-label="公転の速度（1秒あたりの日数）" />
            <output id="speed-out" for="speed">12 日/秒</output>
          </label>
        </div>
        <button class="ctl-btn" id="labels-btn" aria-pressed="true">ラベル</button>
        <button class="ctl-btn" id="orbits-btn" aria-pressed="true">軌道</button>
        <button class="ctl-btn" id="info-btn" aria-pressed="true" aria-controls="info">情報を隠す</button>
        <button class="ctl-btn" id="reset-btn">全体を見る</button>
      </div>
    </div>

    <div id="caption" role="note"></div>

    <div id="sky-hud" hidden>
      <div class="sky-hud-top">
        <span id="sky-dir">北 ・ 方位 0°</span>
        <span id="sky-alt">高度 0°</span>
        <button class="ctl-btn" id="sky-north-btn" type="button">北を向く</button>
      </div>
      <div id="compass" aria-hidden="true"><div id="compass-tape"></div><div class="compass-center"></div></div>
      <div class="sky-prog-row">
        <span id="sky-turn-label">空の回転 0周完了</span>
        <div class="sky-prog"><div id="sky-prog-fill"></div></div>
        <span id="sky-prog-pct">0%</span>
      </div>
      <p class="sky-hud-note">ドラッグで見回せます。再生中は空が回り続け、バーが満ちるとちょうど1周です。</p>
    </div>

    <nav id="body-panel" aria-label="天体リスト">
      <h2 id="body-panel-title">天体リスト</h2>
      <div id="body-list"></div>
    </nav>

    <section id="info" aria-live="polite">
      <button id="info-close" type="button" aria-label="星の情報を隠す" title="情報を隠す">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
      </button>
      <p class="kind" id="info-kind"></p>
      <h2 id="info-name"></h2>
      <p class="sub" id="info-sub"></p>
      <dl id="info-data"></dl>
      <p class="note" id="info-note"></p>
      <div class="actions">
        <button class="ctl-btn" id="focus-btn">この天体に寄る</button>
      </div>
    </section>

    <p id="scale-note">距離・大きさは表示用に圧縮・誇張しています。数値は設定資料（WorldSmith 8.00）に基づきます。</p>
    <p id="hint">ドラッグで回転 ／ ピンチで拡大縮小 ／ タップで詳細</p>
    <div id="err" role="alert"></div>
    <div id="fatal" role="alertdialog" aria-live="assertive" aria-label="表示エラー">
      <div class="fatal-box">
        <p id="fatal-msg"></p>
        <button id="fatal-reload" type="button">再読み込み</button>
        <button id="fatal-2d" type="button">2D表示で開く</button>
      </div>
    </div>
    <div id="gl-wait" role="status" aria-live="polite">
      <div class="gl-wait-box">
        <p>3D表示を準備しています…
画面サイズの変更直後は、3D表示の準備に数秒かかることがあります。</p>
      </div>
    </div>
    <div id="fallback-notice" role="status" hidden>
      <span>3D表示を開始できなかったため、2D表示で星系を表示しています。</span>
      <button id="fallback-retry" type="button">3Dで再試行</button>
      <button id="fallback-close" type="button" aria-label="この表示を閉じる" title="閉じる">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
      </button>
    </div>
    <button id="fallback-pill" type="button" hidden>2D表示中 ・ 3Dで再試行</button>

    <script src="js/01-error-handler.js"></script>
    <script src="js/three.min.js"></script>
    <script src="js/02-three-check.js"></script>
    <script src="js/03-sky-hud.js"></script>
    <script src="js/04-main-3d.js"></script>
    <script src="js/05-boot-driver.js"></script>
    <script src="js/06-fallback-2d.js"></script>
  </body>
</html>
